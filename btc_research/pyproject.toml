[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-research"
version = "0.1.0"
description = "Independent BTC spot research and strategy evaluation. No live trading, no private credentials."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
btc-research = "btc_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
# Run: PYTHONPATH=src python3 -m unittest discover -s tests -v
