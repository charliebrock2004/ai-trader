# Render service definition for the paper worker on the FREE plan.
#
# This file documents the settings the worker needs. Render only *applies* it to
# Blueprint-managed services — a web service you created by hand in the
# dashboard ignores it, so if you already have one, read this as the checklist
# and set the same values there. Do not create a second service: the agent is a
# single writer with one ledger.
#
# The frontend is not here. It stays on Vercel. See DEPLOYMENT.md.
#
# Free hosting sleeps when idle and has no persistent disk. That is accepted
# for this paper experiment. The worker restores the £100 ledger from a GitHub
# checkpoint on boot; the UI says so when the worker is asleep. Do not fake
# RUNNING while it is down.

services:
  - type: web
    name: ai-trader-worker
    runtime: python
    plan: free
    region: frankfurt
    branch: main

    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python3 -m ai_trader http

    # The worker binds $PORT, which Render injects. /health answers during boot,
    # before the agent has finished waking up, so a slow first cycle does not
    # fail the deploy.
    healthCheckPath: /health

    # One writer, one ledger.
    numInstances: 1

    envVars:
      - key: DATABASE_PATH
        value: data/ai_trader.db
      - key: LOG_DIR
        value: logs

      # Paper only. There is no value of this variable that enables live
      # trading; anything live-ish refuses to start the process at all.
      - key: TRADING_MODE
        value: simulate

      - key: STARTING_EQUITY
        value: "100.00"
      - key: BASE_CURRENCY
        value: GBP
      - key: TERMINAL_THRESHOLD_PCT
        value: "0.40"

      # The agent boots halted and waits to be started from the UI, then
      # recover() resumes a session the operator asked to keep running.
      - key: KILL_SWITCH_ENGAGED
        value: "false"

      - key: LOG_LEVEL
        value: INFO

      # Cheapest current general-purpose xAI model for the analyst/skeptic.
      # The key itself is set in the Render dashboard, never committed.
      - key: XAI_MODEL
        value: grok-4.3
      - key: GROK_DAILY_CALL_BUDGET
        value: "8"
      - key: GROK_MIN_INTERVAL_SECONDS
        value: "1800"

      - key: GROK_PAPER_ANALYSIS
        value: "false"

      - key: PERSIST_RESTORE
        value: "true"

      # Optional. If set, the worker writes checkpoints itself. If unset, the
      # GitHub Actions paper-checkpoint workflow copies GET /api/snapshot onto
      # the worker-endpoint branch.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: charliebrock2004/ai-trader

      - key: XAI_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
