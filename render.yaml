# Render service definition for the persistent paper worker.
#
# This file documents the settings the worker needs. Render only *applies* it to
# Blueprint-managed services — a web service you created by hand in the
# dashboard ignores it, so if you already have one, read this as the checklist
# and set the same values there. Do not create a second service: the agent is a
# single writer with one ledger.
#
# The frontend is not here. It stays on Vercel. See DEPLOYMENT.md.

services:
  - type: web
    name: ai-trader-worker
    runtime: python
    plan: starter
    region: frankfurt
    branch: main

    # `plan: free` cannot be used. Free services have no disk and spin down when
    # idle, and an agent that sleeps is an agent that is not trading — worse, it
    # would lose the terminal latch on every wake and come back alive.
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python3 -m ai_trader http

    # The worker binds $PORT, which Render injects. /health answers during boot,
    # before the agent has finished waking up, so a slow first cycle does not
    # fail the deploy.
    healthCheckPath: /health

    # One writer, one ledger.
    numInstances: 1

    # Everything durable lives under this directory: the SQLite database (every
    # decision, order, fill, cost and survival transition), the operator kill
    # switch, and the TERMINAL latch. Without the disk a redeploy erases the
    # audit trail and resurrects a permanently-terminated agent, which is the
    # one failure this system must not have.
    disk:
      name: ai-trader-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: DATABASE_PATH
        value: /var/data/ai_trader.db
      - key: LOG_DIR
        value: /var/data/logs

      # Required. Without it the worker refuses every Start and Stop. Generate
      # with `openssl rand -hex 32` and set the SAME value on Vercel.
      - key: AI_TRADER_API_TOKEN
        sync: false

      # Paper only. There is no value of this variable that enables live
      # trading; anything live-ish refuses to start the process at all.
      - key: TRADING_MODE
        value: simulate

      - key: STARTING_EQUITY
        value: "100.00"
      - key: BASE_CURRENCY
        value: GBP
      - key: TERMINAL_THRESHOLD_PCT
        value: "0.40"

      # The agent boots halted and waits to be started deliberately from the UI.
      - key: KILL_SWITCH_ENGAGED
        value: "false"

      - key: LOG_LEVEL
        value: INFO

      # Optional: the Grok analyst. With no key the agent has nothing
      # challenging its deterministic edge, and the System page reports that
      # rather than hiding it.
      - key: GROK_PAPER_ANALYSIS
        value: "false"
      - key: XAI_API_KEY
        sync: false

      # Optional: lifts the anonymous BLS request quota.
      - key: BLS_API_KEY
        sync: false
