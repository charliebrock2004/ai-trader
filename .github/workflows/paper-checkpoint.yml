# Wake the free Render worker and copy its paper ledger onto worker-endpoint.
# Render free has no disk; this is the durable copy. Live trading cannot be
# enabled from here.
name: paper-checkpoint

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: paper-checkpoint
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER: https://ai-trader-elxv.onrender.com
    steps:
      - name: Checkout noticeboard
        uses: actions/checkout@v4
        with:
          ref: worker-endpoint

      - name: Wake worker and snapshot ledger
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            if curl -fsS --max-time 20 "$WORKER/health" >/tmp/health.json; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "Worker did not wake; skipping checkpoint."
            exit 0
          fi
          curl -fsS --max-time 30 "$WORKER/api/snapshot" -o snapshot.json
          python3 - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("snapshot.json").read_text(encoding="utf-8")
          body = json.loads(raw)
          if body.get("live") is True:
              sys.exit("refusing to store a snapshot that claims live trading")
          if not isinstance(body.get("sql"), str):
              sys.exit("snapshot missing sql")
          pathlib.Path("url.json").write_text(
              json.dumps(
                  {
                      "url": "https://ai-trader-elxv.onrender.com",
                      "engine": "python-worker",
                      "live": False,
                      "live_trading_allowed": False,
                      "updated_at": body.get("updated_at"),
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish checkpoint
        run: |
          git config user.name "ai-trader-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json url.json
          if git diff --cached --quiet; then
            echo "No ledger change."
            exit 0
          fi
          git commit -m "paper ledger checkpoint [skip ci]"
          git push origin HEAD:worker-endpoint
