# Checks the deployed paper worker and the leaderboard every six hours. When a
# check fails it opens one issue (or comments on the open one); when it passes
# again it closes that issue. Read-only GET requests against public endpoints:
# no secrets, no deploy, no trading.
name: health-check

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1,7,13,19 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Health check failing: paper worker or leaderboard"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check
        id: check
        run: |
          set -uo pipefail
          if python scripts/health_check.py > problems.txt; then echo "healthy=true" >> "$GITHUB_OUTPUT"
          else echo "healthy=false" >> "$GITHUB_OUTPUT"; cat problems.txt; fi
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "${{ steps.check.outputs.healthy }}" = "true" ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Healthy again: $RUN_URL"; fi
            exit 0
          fi
          { echo "The scheduled health check found:"; echo; sed 's/^/- /' problems.txt; echo; echo "Run: $RUN_URL"; } > body.md
          if [ -n "$number" ]; then gh issue comment "$number" --body-file body.md
          else gh issue create --title "$TITLE" --body-file body.md; fi
      - name: Fail the run when unhealthy
        if: steps.check.outputs.healthy != 'true'
        run: exit 1
