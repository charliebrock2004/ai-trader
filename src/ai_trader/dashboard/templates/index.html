<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI-Trader</title>
    <meta name="description" content="Paper-only AI trading. Live trading disabled." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://grok.com/grok-app-builder/extensions.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <p class="desk-banner" role="status">PAPER SIMULATION — NO REAL TRADING</p>
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Paper trading</p>
            <h1>AI-Trader</h1>
          </div>
        </div>
        <nav class="top-status" aria-label="App">
          <a class="chip" href="/performance">Performance</a>
          <a class="chip" href="/system">System</a>
        </nav>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="kicker" id="paper-kicker">Grok STOPPED</p>
          <p class="decision" id="decision">HOLD</p>
          <p class="lede">Current BUY / SELL / HOLD decision. Start a paper session. Stop blocks new trades.</p>
        </div>
        <aside class="halt-card">
          <div class="halt-actions halt-actions-stack">
            <button type="button" class="btn btn-danger" id="session-start">Start</button>
            <button type="button" class="btn btn-ghost" id="session-stop">Stop</button>
          </div>
          <p class="halt-meta" id="paper-note"></p>
        </aside>
      </section>

      <dl class="counts counts-3">
        <div>
          <dt>Account balance</dt>
          <dd id="tile-balance">£100.00</dd>
        </div>
        <div>
          <dt>Today’s profit/loss</dt>
          <dd id="tile-pnl">£0.00</dd>
        </div>
        <div>
          <dt>Current position</dt>
          <dd id="tile-position">flat</dd>
        </div>
      </dl>

      <footer class="foot">
        <p>Paper only. Live trading is disabled.</p>
      </footer>
    </div>
    <script src="/static/paper.js"></script>
  </body>
</html>
